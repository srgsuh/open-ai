AWSTemplateFormatVersion: '2010-09-09'
Description: >
  HTTP API Gateway with Lambda integration for authentication endpoints:
  /auth/login and /auth/refresh

Parameters:
  ProjectName:
    Type: String
    Default: api-login
    Description: Project name used for resource naming

  LambdaFunctionArn:
    Type: String
    Default: arn:aws:lambda:il-central-1:773769103104:function:lambda-auth-il-central-1
    Description: ARN of the Lambda function for authentication endpoints

Resources:
  # ================================================================
  # HTTP API GATEWAY
  # ================================================================

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-api'
      ProtocolType: HTTP
      Description: HTTP API Gateway for authentication endpoints
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - '*'
        MaxAge: 300

  # Lambda Integration
  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Ref LambdaFunctionArn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  # Route: /auth/login
  AuthLoginRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /auth/login'
      Target: !Sub 'integrations/${LambdaIntegration}'

  # Route: /auth/refresh
  AuthRefreshRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /auth/refresh'
      Target: !Sub 'integrations/${LambdaIntegration}'

  # API Gateway Stage
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  # ================================================================
  # LAMBDA PERMISSIONS
  # ================================================================

  # Permission for API Gateway to invoke Lambda function
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunctionArn
      Principal: apigateway.amazonaws.com
      Action: lambda:InvokeFunction
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint URL (using default stage)
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/$default'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  ApiId:
    Description: HTTP API Gateway ID
    Value: !Ref HttpApi
    Export:
      Name: !Sub '${AWS::StackName}-ApiId'

  LoginEndpoint:
    Description: Login endpoint URL (using default stage)
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/$default/auth/login'

  RefreshEndpoint:
    Description: Refresh endpoint URL (using default stage)
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/$default/auth/refresh'

  LambdaFunctionArn:
    Description: ARN of the Lambda function used for authentication
    Value: !Ref LambdaFunctionArn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaFunctionArn'
