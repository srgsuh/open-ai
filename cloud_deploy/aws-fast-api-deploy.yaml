AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Complete FastAPI deployment stack: EC2 instance in private subnet with Docker and Ollama,
  NAT Gateway for internet access, and internet-facing ALB with HTTPS.

Parameters:
  ProjectName:
    Type: String
    Default: fastapi-alb-deploy
    Description: Project name used for resource naming

  # ===== VPC and Networking =====
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-01eb545134560739e
    Description: Existing VPC ID where resources will be created

  # Private Subnet Configuration
  PrivateSubnetCidr:
    Type: String
    Default: 172.31.61.0/24
    Description: CIDR block for the private subnet (must be within VPC range and not overlap)

  PrivateSubnetAz:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: il-central-1c
    Description: Availability Zone for the private subnet

  # Public Subnet Configuration (for NAT Gateway)
  PublicSubnetCidr:
    Type: String
    Default: 172.31.62.0/24
    Description: CIDR block for the public subnet (must be within VPC range and not overlap)

  PublicSubnetAz:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: il-central-1c
    Description: Availability Zone for the public subnet (should match private subnet for efficiency)

  # Existing Internet Gateway (required for NAT Gateway)
  InternetGatewayId:
    Type: String
    Default: igw-02e8244f3df25dcc9
    Description: Existing Internet Gateway ID attached to the VPC

  # ALB Public Subnets (minimum 2 in different AZs for high availability)
  AlbPublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of existing PUBLIC subnet IDs for the internet-facing ALB (minimum 2 in different AZs)

  # ===== EC2 Instance Configuration =====
  InstanceType:
    Type: String
    Default: t3.xlarge
    AllowedValues:
      - t3.micro
      - t3.nano
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
      - t3.2xlarge
      - t3a.medium
      - t3a.large
      - t3a.xlarge
    Description: EC2 instance type

  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-0e233d6c0a45f64ec
    Description: Amazon Linux 2023 kernel-6.1 AMI ID (64-bit x86, uefi-preferred)

  ContainerPort:
    Type: Number
    Default: 8000
    Description: Port on which FastAPI container listens

  # ===== Application Configuration =====
  EcrImageUri:
    Type: String
    Description: Full ECR image URI with tag (e.g., 123456789012.dkr.ecr.il-central-1.amazonaws.com/repo:latest)
    Default: 773769103104.dkr.ecr.il-central-1.amazonaws.com/travel_app:latest

  OllamaModel:
    Type: String
    Default: phi3:mini
    Description: Ollama model name to pull and use (e.g., phi3:mini, llama3.1, mistral)

  HealthPath:
    Type: String
    Default: /health
    Description: Health check path for the application

  # ===== ALB and HTTPS Configuration =====
  AcmCertificateArn:
    Type: String
    Default: arn:aws:acm:il-central-1:773769103104:certificate/7b53ee00-977b-4b27-aa72-cd89b4007ce5
    Description: ACM certificate ARN in the same region for ALB HTTPS listener

  AlbIdleTimeoutSeconds:
    Type: Number
    Default: 120
    Description: ALB idle timeout in seconds (increase for long-running requests)

  # ===== Cognito Configuration =====
  ExistingUserPoolId:
    Type: String
    Description: Existing Cognito User Pool ID (e.g., il-central-1_AbCdEf)
    Default: il-central-1_0zf0LNlSD

  ExistingUserPoolClientId:
    Type: String
    Description: Existing Cognito App Client ID (JWT audience)
    Default: 2chpfairj5rakt9lffar3gnv3h

Resources:
  # ================================================================
  # NETWORKING: Private Subnet, Public Subnet, NAT Gateway
  # ================================================================

  # Private Subnet for EC2 Instance
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: !Ref PrivateSubnetCidr
      AvailabilityZone: !Ref PrivateSubnetAz
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-subnet'

  # Route Table for Private Subnet
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-rt'

  # Associate Private Subnet with Route Table
  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # Public Subnet for NAT Gateway
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Ref PublicSubnetAz
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-subnet'

  # Route Table for Public Subnet
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-rt'

  # Route to Internet Gateway for Public Subnet
  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGatewayId

  # Associate Public Subnet with Public Route Table
  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # Elastic IP for NAT Gateway
  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nat-eip'

  # NAT Gateway
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nat-gateway'

  # Route to NAT Gateway for Private Subnet
  PrivateRouteToNat:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  # ================================================================
  # IAM: EC2 Instance Role with SSM and ECR Permissions
  # ================================================================

  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-ec2-role-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ec2-role'

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${ProjectName}-ec2-profile'
      Roles:
        - !Ref Ec2Role

  # ================================================================
  # SECURITY GROUPS
  # ================================================================

  # Security Group for ALB (internet-facing)
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-alb-sg'
      GroupDescription: Security group for internet-facing ALB - allows HTTP/HTTPS from internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Allow HTTP from internet
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow HTTPS from internet
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-alb-sg'

  # Security Group for EC2 Instance
  Ec2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-ec2-sg'
      GroupDescription: Security group for EC2 instance - allows traffic only from ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: Allow traffic from ALB
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic (for NAT Gateway access)
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ec2-sg'

  # ================================================================
  # EC2 INSTANCE: Private Subnet with Docker and Ollama
  # ================================================================

  FastApiInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref Ec2InstanceProfile
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref Ec2SecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-fastapi-instance'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail

          # Log all output to a file for debugging
          exec > >(tee /var/log/user-data.log)
          exec 2>&1

          echo "Starting user data script..."

          # Update system and install dependencies
          yum update -y
          yum install -y docker awscli jq

          # Enable and start Docker
          systemctl enable docker
          systemctl start docker

          # Add ec2-user to docker group for SSM session access
          usermod -aG docker ec2-user || true
          usermod -aG docker ssm-user || true

          # Set AWS region and ECR image URI
          REGION="${AWS::Region}"
          IMAGE_URI="${EcrImageUri}"

          echo "Logging into ECR..."
          # ECR login and pull image
          aws ecr get-login-password --region "$REGION" | \
            docker login --username AWS --password-stdin "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com"
          
          echo "Pulling Docker image: $IMAGE_URI"
          docker pull "$IMAGE_URI"

          echo "Starting FastAPI container..."
          # Run FastAPI container with environment variables
          docker run -d \
            --name travel_info \
            --restart=always \
            --network host \
            -e LOGGER_LEVEL=INFO \
            -e OLLAMA_MODEL_NAME="${OllamaModel}" \
            -e REGION="$REGION" \
            -e USER_POOL_ID="${ExistingUserPoolId}" \
            -e APP_CLIENT_ID="${ExistingUserPoolClientId}" \
            "$IMAGE_URI"

          echo "Installing Ollama..."
          # Install Ollama
          curl -fsSL https://ollama.com/install.sh | sh

          # Enable and start Ollama service
          systemctl enable ollama
          systemctl start ollama

          echo "Waiting for Ollama service to be ready..."
          sleep 10

          echo "Pulling Ollama model: ${OllamaModel}"
          # Pull the specified Ollama model
          ollama pull "${OllamaModel}"

          echo "User data script completed successfully!"

  # ================================================================
  # APPLICATION LOAD BALANCER (ALB)
  # ================================================================

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-alb'
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Ref AlbPublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: 'false'
        - Key: idle_timeout.timeout_seconds
          Value: !Ref AlbIdleTimeoutSeconds
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-alb'

  # Target Group for EC2 Instance
  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-tg'
      VpcId: !Ref VpcId
      TargetType: instance
      Protocol: HTTP
      Port: !Ref ContainerPort
      Targets:
        - Id: !Ref FastApiInstance
          Port: !Ref ContainerPort
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthPath
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-tg'

  # HTTP Listener - Redirect to HTTPS
  AlbListenerHttp:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  # HTTPS Listener
  AlbListenerHttps:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref AcmCertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

Outputs:
  # Networking Outputs
  PrivateSubnetId:
    Description: ID of the created private subnet
    Value: !Ref PrivateSubnet
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnetId'

  PublicSubnetId:
    Description: ID of the created public subnet
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnetId'

  NatGatewayId:
    Description: ID of the NAT Gateway
    Value: !Ref NatGateway
    Export:
      Name: !Sub '${AWS::StackName}-NatGatewayId'

  NatEipAddress:
    Description: Elastic IP address of the NAT Gateway
    Value: !Ref NatEip
    Export:
      Name: !Sub '${AWS::StackName}-NatEipAddress'

  # EC2 Outputs
  Ec2InstanceId:
    Description: ID of the EC2 instance
    Value: !Ref FastApiInstance
    Export:
      Name: !Sub '${AWS::StackName}-Ec2InstanceId'

  Ec2InstancePrivateIp:
    Description: Private IP address of the EC2 instance
    Value: !GetAtt FastApiInstance.PrivateIp
    Export:
      Name: !Sub '${AWS::StackName}-Ec2InstancePrivateIp'

  Ec2SecurityGroupId:
    Description: Security Group ID for the EC2 instance
    Value: !Ref Ec2SecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-Ec2SecurityGroupId'

  Ec2RoleArn:
    Description: ARN of the IAM role for the EC2 instance
    Value: !GetAtt Ec2Role.Arn
    Export:
      Name: !Sub '${AWS::StackName}-Ec2RoleArn'

  # ALB Outputs
  AlbDnsName:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt Alb.DNSName
    Export:
      Name: !Sub '${AWS::StackName}-AlbDnsName'

  AlbArn:
    Description: ARN of the Application Load Balancer
    Value: !Ref Alb
    Export:
      Name: !Sub '${AWS::StackName}-AlbArn'

  HttpsBaseUrl:
    Description: Base HTTPS URL for the application
    Value: !Sub 'https://${Alb.DNSName}'

  HealthCheckUrl:
    Description: Health check endpoint URL
    Value: !Sub 'https://${Alb.DNSName}${HealthPath}'

  # Additional Information
  UserDataLog:
    Description: Location of user data execution log on EC2 instance
    Value: /var/log/user-data.log

  SsmSessionCommand:
    Description: Command to connect to EC2 instance via SSM
    Value: !Sub 'aws ssm start-session --target ${FastApiInstance} --region ${AWS::Region}'
