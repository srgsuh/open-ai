AWSTemplateFormatVersion: '2010-09-09'
Description:
  Production-ready FastAPI deployment on ECS Fargate behind an internet-facing
  Application Load Balancer with HTTPS termination and request-based auto-scaling.

Parameters:
  # ===== Project Naming =====
  ProjectName:
    Type: String
    Default: fastapi-fargate
    Description: Project name used for tagging and resource naming

  # ===== Existing Network and TLS Resources =====
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-01eb545134560739e
    Description: Existing VPC ID where resources will be created


  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of existing PUBLIC subnet IDs for the internet-facing ALB (minimum 2 in different AZs)

  AcmCertificateArn:
    Type: String
    Default: arn:aws:acm:il-central-1:773769103104:certificate/7b53ee00-977b-4b27-aa72-cd89b4007ce5
    Description: ACM certificate ARN for the ALB HTTPS listener (must be in same region)

  # ===== Application Container Configuration =====
  ContainerImage:
    Type: String
    Default: 773769103104.dkr.ecr.il-central-1.amazonaws.com/travel_app:latest
    Description: Full container image URI (ECR or external registry)

  ContainerPort:
    Type: Number
    Default: 8000
    Description: Port on which the application container listens

  ContainerCpu:
    Type: Number
    Default: 256
    Description: CPU units for the Fargate task (e.g., 256 = 0.25 vCPU)

  ContainerMemory:
    Type: Number
    Default: 512
    Description: Memory for the Fargate task in MiB

  HealthCheckPath:
    Type: String
    Default: /health
    Description: Health check path for the application (HTTP 200 expected)

  # ===== ECS Service Scaling Configuration =====
  DesiredTaskCount:
    Type: Number
    Default: 1
    Description: Desired number of ECS tasks to run

  MinTaskCount:
    Type: Number
    Default: 1
    Description: Minimum number of ECS tasks

  MaxTaskCount:
    Type: Number
    Default: 5
    Description: Maximum number of ECS tasks

  TargetRequestsPerTarget:
    Type: Number
    Default: 100
    Description: Target ALB requests per target (per minute) for auto scaling (ALBRequestCountPerTarget)

  ScaleInCooldownSeconds:
    Type: Number
    Default: 120
    Description: Cooldown period in seconds after a scale-in activity completes

  ScaleOutCooldownSeconds:
    Type: Number
    Default: 60
    Description: Cooldown period in seconds after a scale-out activity completes

  # ===== CloudWatch Logging Configuration =====
  LogGroupSuffix:
    Type: String
    Default: "1"
    Description: Suffix for the CloudWatch Logs log group name

  LogGroupName:
    Type: String
    Default: ""
    Description: Name of the CloudWatch Logs log group for container logs (defaults to /ecs/<StackName>/<Suffix> if empty)

  LogGroupRetentionInDays:
    Type: Number
    Default: 1
    Description: Retention period in days for CloudWatch Logs

  # ===== API Keys Configuration =====
  FixerApiKey:
    Type: String
    NoEcho: true
    Description: API key for Fixer.io exchange rate service

  WeatherApiKey:
    Type: String
    NoEcho: true
    Description: API key for WeatherAPI.com service

  # ===== ALB Access Logs =====
  AlbAccessLogsBucketName:
    Type: String
    Default: my-alb-access-logs-bucket
    Description: S3 bucket name where ALB access logs will be delivered

  AlbAccessLogsPrefix:
    Type: String
    Default: alb/access-logs
    Description: Prefix within the S3 bucket for ALB access logs

Conditions:
  HasCustomLogGroupName: !Not [!Equals [!Ref LogGroupName, '']]

Resources:
  # ================================================================
  # NETWORKING: Private Subnets and Route Tables for Fargate Tasks
  # ================================================================

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 172.31.80.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub 'sn-priv-${ProjectName}'

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 172.31.81.0/24
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub 'sn-priv-${ProjectName}'

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub 'rt-priv-${ProjectName}'

  # Elastic IP for NAT Gateway (shared for both private subnets)
  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nat-eip'

  # NAT Gateway in an existing public subnet (first from the provided list)
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Select
        - 0
        - !Ref PublicSubnetIds
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nat-gateway'

  # Route from private route table to NAT Gateway (used by both private subnets)
  PrivateRouteToNat:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetRouteTableAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # ================================================================
  # SECURITY GROUPS
  # ================================================================

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for internet-facing ALB - allows HTTP/HTTPS from internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Allow HTTP from internet
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow HTTPS from internet
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-alb-sg'

  EcsTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECS tasks - allows traffic only from ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: Allow HTTP traffic from ALB
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ecs-tasks-sg'

  # ================================================================
  # CLOUDWATCH LOGS
  # ================================================================

  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !If
        - HasCustomLogGroupName
        - !Ref LogGroupName
        - !Sub '/ecs/${AWS::StackName}/${LogGroupSuffix}'
      RetentionInDays: !Ref LogGroupRetentionInDays

  # ================================================================
  # IAM ROLES
  # ================================================================

  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-ecs-task-execution-role-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ecs-task-execution-role'

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-ecs-task-role-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      # Add application-specific policies here if needed
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ecs-task-role'

  ApplicationAutoScalingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-app-autoscaling-role-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: application-autoscaling.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ECSServiceAutoScalingPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DeleteAlarms
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-app-autoscaling-role'

  # ================================================================
  # ECS CLUSTER, TASK DEFINITION, AND SERVICE
  # ================================================================

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-cluster'
      CapacityProviders: []
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-cluster'

  EcsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-task'
      Cpu: !Ref ContainerCpu
      Memory: !Ref ContainerMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: fastapi-container
          Image: !Ref ContainerImage
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: FIXER_API_KEY
              Value: !Ref FixerApiKey
            - Name: WEATHER_API_KEY
              Value: !Ref WeatherApiKey
          Command:
            - /bin/sh
            - -c
            - |
              echo "Starting FastAPI application with API keys configured..."
              if [ -n "$$FIXER_API_KEY" ]; then echo "FIXER_API_KEY is configured"; fi
              if [ -n "$$WEATHER_API_KEY" ]; then echo "WEATHER_API_KEY is configured"; fi
              exec uvicorn main:app --host 0.0.0.0 --port 8000
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !If
                - HasCustomLogGroupName
                - !Ref LogGroupName
                - !Sub '/ecs/${AWS::StackName}/${LogGroupSuffix}'
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Essential: true

  EcsService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpsListener
    Properties:
      ServiceName: !Sub '${ProjectName}-service'
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref EcsTaskDefinition
      DesiredCount: !Ref DesiredTaskCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
          SecurityGroups:
            - !Ref EcsTaskSecurityGroup
      LoadBalancers:
        - ContainerName: fastapi-container
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref EcsTargetGroup
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
      HealthCheckGracePeriodSeconds: 60

  # ================================================================
  # APPLICATION LOAD BALANCER AND TARGET GROUP
  # ================================================================

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-alb'
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: 'false'
        - Key: access_logs.s3.enabled
          Value: 'true'
        - Key: access_logs.s3.bucket
          Value: !Ref AlbAccessLogsBucketName
        - Key: access_logs.s3.prefix
          Value: !Ref AlbAccessLogsPrefix
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-alb'

  EcsTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-tg'
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ContainerPort
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-tg'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref AcmCertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref EcsTargetGroup

  # ================================================================
  # APPLICATION AUTO SCALING (ECS SERVICE)
  # ================================================================

  EcsServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !Ref MaxTaskCount
      MinCapacity: !Ref MinTaskCount
      ResourceId: !Sub service/${EcsCluster}/${EcsService}
      RoleARN: !GetAtt ApplicationAutoScalingRole.Arn
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  EcsServiceScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${ProjectName}-request-based-scaling-policy'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref EcsServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Sub '${ApplicationLoadBalancer.LoadBalancerFullName}/${EcsTargetGroup.TargetGroupFullName}'
        TargetValue: !Ref TargetRequestsPerTarget
        ScaleInCooldown: !Ref ScaleInCooldownSeconds
        ScaleOutCooldown: !Ref ScaleOutCooldownSeconds

Outputs:
  AlbDnsName:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  EcsClusterName:
    Description: Name of the ECS cluster
    Value: !Ref EcsCluster

  EcsServiceName:
    Description: Name of the ECS service
    Value: !Ref EcsService

